<style>
:root{
  color-scheme:light;
  --bg:#f2f5f3;--paper:#fff;--ink:#17251f;--sub:#68776f;--line:#dce5df;
  --accent:#245744;--accent2:#39765b;--on-accent:#fff;--sel:#e8f3ec;
  --ok:#167348;--okbg:#e5f5eb;--bad:#b42332;--badbg:#fff0f0;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top left,#e2eee5 0,transparent 38%),var(--bg);color:var(--ink);
font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}button{cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s,border-color .16s}

:focus-visible{outline:3px solid #80b99a;outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 124px}
.home-title{font-size:clamp(29px,5vw,42px);font-weight:900;letter-spacing:-.045em;line-height:1.18;margin:36px 0 10px;padding:0;border:0;display:block}
.home-title:before{content:"SECURITY · TRAINING";display:block;font-size:11px;letter-spacing:.18em;color:var(--accent2);font-weight:900;margin-bottom:13px}
.home-title:after{content:"";display:block;width:62px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent),#a6c8ad);margin-top:18px}
.home-sub{color:var(--sub);margin:0 0 28px;font-size:15px}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.set-btn{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#f9fcfa);border:1px solid var(--line);border-radius:18px;padding:23px 21px 20px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-height:174px}
.set-btn:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-28px;top:-30px;background:rgba(55,117,87,.07)}
.set-btn:hover{border-color:#83ad91;background:var(--sel);box-shadow:0 14px 34px rgba(22,48,35,.12);transform:translateY(-2px)}
.set-btn .num{font-size:clamp(38px,6vw,50px);font-weight:900;line-height:1.05;letter-spacing:-.06em;color:var(--accent)}
.set-btn .meta{font-size:13px;color:var(--sub);line-height:1.65;white-space:pre-line}
.set-btn .meta:before{content:"25문항 구성";display:block;color:var(--accent2);font-weight:800;font-size:11px;letter-spacing:.03em;margin-bottom:4px}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(22,48,35,.04)}
.topbar-in{max-width:820px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:750;white-space:nowrap}
.back:hover{border-color:var(--accent);background:var(--sel)}
.top-title{font-weight:900;font-size:17px;letter-spacing:-.02em}
.top-prog{margin-left:auto;font-size:13px;color:var(--sub);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:5px;background:#e7eee9}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#245744,#8fbd9b);transition:width .2s;border-radius:0 5px 5px 0}
.sec-head{margin:30px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border:0;padding:0}
.sec-head h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.035em}
.sec-head span{color:var(--sub);font-size:13px;background:#e7eee9;padding:4px 9px;border-radius:999px;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 17px;margin-bottom:13px;display:grid;grid-template-columns:2em minmax(0,1fr);column-gap:8px;box-shadow:0 5px 18px rgba(22,48,35,.035)}
.qno{font-weight:900;font-size:15px;color:var(--accent);background:var(--sel);border-radius:9px;width:29px;height:29px;display:grid;place-items:center}
.qtext{white-space:pre-line;line-height:1.85}
.qbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0 0;white-space:pre-line;font-size:15px;background:#f8fbf9}
.blank{display:inline-block;width:9.5em;max-width:100%;margin:3px;padding:5px 9px;border:1px solid #c8dbce;border-bottom:2px solid var(--accent2);background:#f1f8f3;border-radius:8px;font-size:15px;transition:background .15s,border-color .15s}
.blank::placeholder{color:#8a9a90;opacity:1}.blank:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(57,118,91,.12)}
.opts{grid-column:2;margin-top:12px;display:grid;gap:8px}
.opt{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;grid-template-columns:1.7em 1fr;gap:7px;align-items:start;line-height:1.65}
.opt>span:first-child{display:grid;place-items:center;width:25px;height:25px;background:#f0f4f1;border-radius:8px;color:var(--sub);font-size:13px;font-weight:900}
.opt:hover{border-color:#8eb49a;background:#fbfefc}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset;font-weight:700}
.opt[aria-pressed="true"]>span:first-child{background:var(--accent);color:#fff}
.tf{grid-column:2;margin-top:12px;display:flex;gap:10px}
.tf button{flex:1;padding:11px 0;font-size:21px;font-weight:900;background:#fff;border:1px solid var(--line);border-radius:12px}
.tf button:hover{border-color:var(--accent2);background:#f6fbf7}
.tf button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 5px 12px rgba(36,87,68,.18)}
table.mini{border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:10px;margin-top:12px;width:100%;font-size:14px;text-align:center}
table.mini th,table.mini td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 6px}
table.mini th{background:#eaf2ec;color:var(--accent);font-weight:850}
table.mini tr:first-child th{border-top:1px solid var(--line)}table.mini td:first-child,table.mini th:first-child{border-left:1px solid var(--line)}

.primary{width:100%;padding:14px 18px;font-size:16px;font-weight:900;letter-spacing:-.01em;background:linear-gradient(135deg,#245744,#39765b);color:#fff;border:0;border-radius:13px;box-shadow:0 7px 18px rgba(36,87,68,.2)}

.score-parts b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;margin-top:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions .primary{width:auto;flex:1 1 200px}.actions .ghost{flex:1 1 120px}
.tabs{display:flex;gap:8px;margin:26px 0 13px}
.tab{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:800;color:var(--sub)}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rv{border-left:5px solid var(--line);display:block;padding:16px 17px}
.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--bad)}
.rv-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:900}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:900}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.no{background:var(--badbg);color:var(--bad)}
.rv-q{white-space:pre-line;margin-bottom:12px;line-height:1.8}
.ans-grid{display:grid;gap:7px}
.ans-row{display:grid;grid-template-columns:4.6em 1fr;gap:8px;padding:9px 11px;border-radius:9px;background:#f6f8f6}
.ans-row.mine{background:var(--badbg)}.ans-row.mine.right,.ans-row.right-answer{background:var(--okbg)}
.ans-row .lab{font-weight:900;font-size:13px}.ans-row.mine .lab{color:var(--bad)}
.ans-row.mine.right .lab,.ans-row.right-answer .lab{color:var(--ok)}
.blank-tag{font-weight:900;color:var(--sub);margin-right:4px}
.empty{padding:32px 18px;text-align:center;color:var(--sub);background:#fff;border:1px dashed #bdcec2;border-radius:16px}
@media(max-width:520px){
 .wrap{padding:18px 13px 116px}.home-title{margin-top:25px}.set-grid{gap:10px}.set-btn{padding:18px 15px;min-height:155px;border-radius:15px}.set-btn .num{font-size:38px}
 .topbar-in{padding:10px 12px;gap:8px}.top-title{font-size:15px}.back{padding:7px 9px}

}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

<script>
/* ================== 문제 데이터 ================== */
/* short: q 안의 {_} 는 빈칸, a 는 정답(배열 안의 배열은 허용 답안), any:true 는 순서 무관
   mc: a 는 정답 번호(0부터), tf: a 는 "O" | "X" */
const SETS = {
  1: {
    short: [

      { q: "비밀의 재분류 및 예고문 변경에 대한 설명으로 틀린 것은?", o: ["비밀이 과도 또는 과소하게 분류되었다고 판단될 때에는 적절한 등급으로 재분류할 수 있다.", "비밀 원본에 대한 재분류 및 예고문 변경 검토 결과를 비밀이력카드에 기록해야 한다.", "하급부대로부터 접수한 Ⅱ급·Ⅲ급 비밀은 생산부대의 승인을 받아 재분류 및 예고문 변경이 가능하다.", "대외기관으로부터 접수한 Ⅱ급·Ⅲ급 비밀은 발행기관의 승인을 받아 재분류 및 예고문 변경이 가능하다."], a: 2 },
      { q: "바이러스 감염이 발견되었을 때 필요한 조치가 아닌 것은?", o: ["바이러스 감염 피해를 최소화하기 위하여 감염된 시스템 네트워크 분리", "바이러스 감염현장(시스템)을 보존하고 침해사고 대응반 및 방첩부대에 신고", "바이러스 감염 확산 방지를 위해 부대 내 사용자에게도 관련 사실을 미전파", "바이러스 백신프로그램을 이용하여 정상 복구"], a: 2 },
      { q: "보안SW가 설치된 KJCCS 단말기에 비밀자료를 저장하는 방법으로 올바른 것은?", o: ["비밀의 보관은 국가용 보안시스템이 적용되어 암호화되는 암호화 폴더(D:\\KJCCS암호화)에서만 가능하다.", "비밀 보관을 위한 임의의 폴더 생성시에는 절차에 따라 체계관리부서의 승인을 받아야 한다.", "보관용 암호화 폴더에 저장된 비밀자료는 합참은 비밀관리시스템, 그 외 부대는 비밀자료 목록표에 기록 후 관리하여야 한다.", "비밀자료를 타 체계(국방망)로 이동시 단말기 사용부서에 설치된 자료 이동용 PC를 통해 자료이동 하여야 한다."], a: 0 }
    ],
    tf: [
      { q: "업무참고용으로 비밀을 복제·복사하여 비밀바인더를 작성할 경우에는 비밀지정권자의 승인을 받아 접수용 비밀관리기록부에 등재한다.", a: "X" },
      { q: "비밀은 최초 보관책임관 “정”이 결재한 때부터 비밀로 지정되며, 최종 결재권자의 결재 후 관리번호를 부여하고 접수용 비밀관리기록부에 등재하여 관리한다.", a: "X" },
      { q: "등기우편으로 비밀을 발송할 경우 이중봉투를 사용하고, 내외부 봉투에 비밀표시를 하여야 한다.", a: "X" },
      { q: "비밀 부분 대체시 원본 생산부대는 부분 대체되어 나온 대체문을 파기하여야 한다.", a: "X" },
      { q: "군 공사 참여 인원에게 공사에 필요한 비밀자료 지출·대출은 불가하다.", a: "X" },
      { q: "군사제한구역은 개인소유 상용정보통신장비 반입이 가능하지만 사진 촬영과 녹음은 불가하다.", a: "O" },
      { q: "암호장비 외부에는 장비 운용·관리를 위해 형식번호, 기관번호 및 일련번호를 표시해야 한다.", a: "X" },
      { q: "보안담당관이 교체될 때에는 소관 업무에 대하여 인수인계서를 작성하여 부대장에게 보고하고 확인 서명을 받아야 한다.", a: "O" },
      { q: "각급부대 및 기관의 장은 사물인터넷을 이용한 시스템을 구축·운용하고자 할 경우 외부망과 분리하여야 한다. 내부망은 필요시 연동 가능하다.", a: "X" },
      { q: "각급부대의 장은 컴퓨터 바이러스 감염 및 악성코드 유입으로 피해 발생 시 피해받은 장비들을 보존하여야 하며, 임의로 삭제하거나 포맷하여서는 아니 된다.", a: "O" }
    ]
  }
};

const SECTIONS = [
  { t: "short", name: "단답형", pts: 5 },
  { t: "mc",    name: "선택형", pts: 4 },
  { t: "tf",    name: "진위형", pts: 3 }
];
const CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

/* ================== 유틸 ================== */
const app = document.getElementById("app");
let cur = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const norm = s => String(s == null ? "" : s).replace(/[\s,·.()'"‘’“”「」]/g, "").toLowerCase();
const alts = a => Array.isArray(a) ? a : [a];
const dispAns = a => alts(a)[0];
const secOf = t => SECTIONS.find(s => s.t === t);

function mount(node) {
  app.replaceChildren(node);
  window.scrollTo(0, 0);
}

/* ================== 안 선택 화면 ================== */
function renderHome() {
  cur = null;
  const w = el("div", "wrap");
  w.append(el("h1", "home-title", "보안규정 평가 문제지"));
  w.append(el("p", "home-sub", "풀어볼 안을 선택하세요."));
  const grid = el("div", "set-grid");
  Object.keys(SETS).forEach(n => {
    const b = el("button", "set-btn");
    b.append(el("span", "num", n + "안"));
    b.append(el("span", "meta", "단답형 10문제\n선택형 5문제\n진위형 10문제"));
    b.lastChild.style.whiteSpace = "pre-line";
    b.addEventListener("click", () => startQuiz(+n));
    grid.append(b);
  });
  w.append(grid);
  mount(w);
}

/* ================== 퀴즈 ================== */
function startQuiz(n, only) {
  const S = SETS[n];
  const items = [];
  SECTIONS.forEach(sec => S[sec.t].forEach((_, i) => {
    if (!only || only.has(sec.t + i)) items.push({ t: sec.t, i });
  }));
  cur = { n, items, ans: { short: {}, mc: {}, tf: {} }, retry: !!only };
  renderQuiz();
}

function isAnswered(it) {
  const v = cur.ans[it.t][it.i];
  if (it.t === "short") return Array.isArray(v) && v.some(x => x && x.trim());
  return v !== undefined;
}
function updateProgress() {
  const done = cur.items.filter(isAnswered).length;
  const total = cur.items.length;
  const p = document.getElementById("prog");
  const b = document.getElementById("barfill");
  if (p) p.textContent = done + " / " + total;
  if (b) b.style.width = (done / total * 100) + "%";
}

function qNo(i) { return el("div", "qno", (i + 1) + "."); }

function buildShort(i) {
  const q = SETS[cur.n].short[i];
  const card = el("article", "card");
  card.append(qNo(i));
  const body = el("div", "qtext");
  const parts = q.q.split("{_}");
  const multi = parts.length > 2;
  const inputs = [];
  parts.forEach((p, k) => {
    body.append(document.createTextNode(p));
    if (k < parts.length - 1) {
      const inp = el("input", "blank");
      inp.type = "text";
      inp.autocomplete = "off";
      inp.autocapitalize = "off";
      inp.spellcheck = false;
      inp.placeholder = multi ? CIRCLED[k] : "정답";
      inp.setAttribute("aria-label", i + 1 + "번 빈칸 " + (k + 1));
      inp.addEventListener("input", () => {
        const arr = cur.ans.short[i] || (cur.ans.short[i] = []);
        arr[k] = inp.value;
        updateProgress();
      });
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          const all = [...document.querySelectorAll(".blank")];
          const nx = all[all.indexOf(inp) + 1];
          if (nx) nx.focus(); else inp.blur();
        }
      });
      inputs.push(inp);
      body.append(inp);
    }
  });
  card.append(body);
  return card;
}

function buildMc(i) {
  const q = SETS[cur.n].mc[i];
  const card = el("article", "card");
  card.append(qNo(i));
  card.append(el("div", "qtext", q.q));
  const box = el("div", "opts");
  q.o.forEach((txt, k) => {
    const b = el("button", "opt");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.append(el("span", "", CIRCLED[k]), el("span", "", txt));
    b.addEventListener("click", () => {
      cur.ans.mc[i] = k;
      [...box.children].forEach((c, j) => c.setAttribute("aria-pressed", j === k ? "true" : "false"));
      updateProgress();
    });
    box.append(b);
  });
  card.append(box);
  return card;
}

function lanTable() {
  const t = el("table", "mini");
  const rows = [["구 분", "KJCCS", "AKJCCS", "JFOS-K"], ["색 상", "청색", "검정색", "보라색"]];
  rows.forEach((r, ri) => {
    const tr = el("tr");
    r.forEach(c => tr.append(el(ri === 0 ? "th" : "td", "", c)));
    t.append(tr);
  });
  return t;
}

function buildTf(i) {
  const q = SETS[cur.n].tf[i];
  const card = el("article", "card");
  card.append(qNo(i));
  const body = el("div", "qtext", q.q);
  if (q.table) body.append(lanTable());
  card.append(body);
  const row = el("div", "tf");
  ["O", "X"].forEach(v => {
    const b = el("button", "", v);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", v === "O" ? "맞다 (O)" : "틀리다 (X)");
    b.addEventListener("click", () => {
      cur.ans.tf[i] = v;
      [...row.children].forEach(c => c.setAttribute("aria-pressed", c.textContent === v ? "true" : "false"));
      updateProgress();
    });
    row.append(b);
  });
  card.append(row);
  return card;
}

function renderQuiz() {
  const frag = el("div");

  const top = el("div", "topbar");
  const inn = el("div", "topbar-in");
  const back = el("button", "back", "안 선택");
  back.addEventListener("click", () => {
    if (cur.items.some(isAnswered) && !confirm("풀던 내용이 사라집니다. 안 선택 화면으로 갈까요?")) return;
    renderHome();
  });
  const title = el("span", "top-title", cur.n + "안" + (cur.retry ? " 틀린 문제 다시 풀기" : ""));
  const prog = el("span", "top-prog"); prog.id = "prog";
  inn.append(back, title, prog);
  const bar = el("div", "bar"); const fill = el("i"); fill.id = "barfill"; bar.append(fill);
  top.append(inn, bar);
  frag.append(top);

  const w = el("div", "wrap");
  SECTIONS.forEach(sec => {
    const list = cur.items.filter(it => it.t === sec.t);
    if (!list.length) return;
    const head = el("div", "sec-head");
    head.append(el("h2", "", sec.name), el("span", "", list.length + "문제 · 항목당 " + sec.pts + "점"));
    w.append(head);
    list.forEach(it => {
      w.append(it.t === "short" ? buildShort(it.i) : it.t === "mc" ? buildMc(it.i) : buildTf(it.i));
    });
  });
  frag.append(w);

  const sb = el("div", "submit-bar");
  const inner = el("div");
  const btn = el("button", "primary", "제출하고 채점하기");
  btn.addEventListener("click", submit);
  inner.append(btn); sb.append(inner);
  frag.append(sb);

  mount(frag);
  updateProgress();
}

/* ================== 채점 ================== */
function gradeShort(q, userArr) {
  const user = q.a.map((_, k) => (userArr && userArr[k]) || "");
  let blankOk, ok;
  if (q.any) {
    const used = new Set();
    blankOk = user.map(u => {
      const k = q.a.findIndex((a, j) => !used.has(j) && alts(a).some(x => norm(x) === norm(u)));
      if (k < 0) return false;
      used.add(k); return true;
    });
    ok = blankOk.every(Boolean);
  } else {
    blankOk = q.a.map((a, k) => alts(a).some(x => norm(x) === norm(user[k])));
    ok = blankOk.every(Boolean);
  }
  return { ok, user, blankOk };
}

function grade(it) {
  const S = SETS[cur.n];
  const q = S[it.t][it.i];
  const v = cur.ans[it.t][it.i];
  if (it.t === "short") return { q, ...gradeShort(q, v) };
  if (it.t === "mc") return { q, ok: v === q.a, mine: v };
  return { q, ok: v === q.a, mine: v };
}

function submit() {
  const un = cur.items.filter(it => !isAnswered(it)).length;
  if (un > 0 && !confirm("아직 답하지 않은 문제가 " + un + "개 있습니다. 그래도 제출할까요?")) return;
  renderResult("wrong");
}

/* ================== 결과 ================== */
function renderResult(filter) {
  const results = cur.items.map(it => ({ ...it, ...grade(it) }));
  const per = {};
  SECTIONS.forEach(s => per[s.t] = { got: 0, max: 0, n: 0, right: 0 });
  results.forEach(r => {
    const s = secOf(r.t);
    per[r.t].max += s.pts; per[r.t].n++;
    if (r.ok) { per[r.t].got += s.pts; per[r.t].right++; }
  });
  const got = SECTIONS.reduce((a, s) => a + per[s.t].got, 0);
  const max = SECTIONS.reduce((a, s) => a + per[s.t].max, 0);
  const wrong = results.filter(r => !r.ok);

  const w = el("div", "wrap");

  const topRow = el("div");
  const back = el("button", "back", "안 선택");
  back.addEventListener("click", renderHome);
  topRow.append(back);
  w.append(topRow);

  const box = el("section", "score-box");
  const main = el("div", "score-main");
  main.append(el("b", "", String(got)), el("span", "", "/ " + max + "점"));
  box.append(el("div", "score-line", cur.n + "안" + (cur.retry ? " 틀린 문제 다시 풀기 결과" : " 채점 결과")));
  box.append(main);
  box.append(el("div", "score-line", wrong.length === 0 ? "모두 맞혔습니다." : "틀린 문제 " + wrong.length + "개 / 전체 " + results.length + "개"));
  const parts = el("div", "score-parts");
  SECTIONS.forEach(s => {
    if (!per[s.t].n) return;
    const d = el("div");
    d.append(document.createTextNode(s.name));
    d.append(el("b", "", per[s.t].got + " / " + per[s.t].max + "점"));
    parts.append(d);
  });
  box.append(parts);

  const act = el("div", "actions");
  if (wrong.length) {
    const rb = el("button", "primary", "틀린 문제만 다시 풀기");
    rb.addEventListener("click", () => startQuiz(cur.n, new Set(wrong.map(r => r.t + r.i))));
    act.append(rb);
  }
  const again = el("button", "ghost", "처음부터 다시");
  again.addEventListener("click", () => startQuiz(cur.n));
  act.append(again);
  box.append(act);
  w.append(box);

  const tabs = el("div", "tabs");
  const tW = el("button", "tab", "틀린 문제 " + wrong.length);
  const tA = el("button", "tab", "전체 " + results.length);
  tW.setAttribute("aria-pressed", filter === "wrong");
  tA.setAttribute("aria-pressed", filter === "all");
  tW.addEventListener("click", () => { renderResult("wrong"); });
  tA.addEventListener("click", () => { renderResult("all"); });
  tabs.append(tW, tA);
  w.append(tabs);

  const shown = filter === "wrong" ? wrong : results;
  if (!shown.length) {
    w.append(el("div", "empty", "틀린 문제가 없습니다."));
  }
  shown.forEach(r => w.append(buildReview(r)));

  mount(w);
}

function ansRow(kind, label, text) {
  const r = el("div", "ans-row " + kind);
  r.append(el("span", "lab", label), el("span", "", text));
  return r;
}

function buildReview(r) {
  const sec = secOf(r.t);
  const card = el("article", "card rv " + (r.ok ? "ok" : "no"));
  const head = el("div", "rv-head");
  head.append(el("span", "", sec.name + " " + (r.i + 1) + "번"));
  head.append(el("span", "badge " + (r.ok ? "ok" : "no"), r.ok ? "정답" : "오답"));
  card.append(head);

  const grid = el("div", "ans-grid");

  if (r.t === "short") {
    const stem = r.q.q.replace(/\{_\}/g, "(    )");
    card.append(el("div", "rv-q", stem));
    if (r.q.any) {
      grid.append(ansRow("mine" + (r.ok ? " right" : ""), "내 답안", r.user.map(u => u.trim() || "(미응답)").join(",  ")));
      grid.append(ansRow("right-answer", "정답", r.q.a.map(dispAns).join(",  ") + "  (순서 무관)"));
    } else {
      r.q.a.forEach((a, k) => {
        const tag = r.q.a.length > 1 ? CIRCLED[k] + " " : "";
        const mine = r.user[k].trim() || "(미응답)";
        if (r.blankOk[k]) {
          grid.append(ansRow("mine right", "내 답안", tag + mine));
        } else {
          grid.append(ansRow("mine", "내 답안", tag + mine));
          grid.append(ansRow("right-answer", "정답", tag + dispAns(a)));
        }
      });
    }
  } else if (r.t === "mc") {
    card.append(el("div", "rv-q", r.q.q));
    const mineTxt = r.mine === undefined ? "(미응답)" : CIRCLED[r.mine] + " " + r.q.o[r.mine];
    grid.append(ansRow("mine" + (r.ok ? " right" : ""), "내 답안", mineTxt));
    if (!r.ok) grid.append(ansRow("right-answer", "정답", CIRCLED[r.q.a] + " " + r.q.o[r.q.a]));
  } else {
    const qq = el("div", "rv-q", r.q.q);
    if (r.q.table) qq.append(lanTable());
    card.append(qq);
    grid.append(ansRow("mine" + (r.ok ? " right" : ""), "내 답안", r.mine === undefined ? "(미응답)" : r.mine));
    if (!r.ok) grid.append(ansRow("right-answer", "정답", r.q.a));
  }
  card.append(grid);
  return card;
}

renderHome();
</script>
